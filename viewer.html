<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/"
      }

    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            color: #fafafa;
            background-color: #d3d3d3;
        }

        .box {
            position: absolute;
            background-color: rgba(36, 36, 36, 0.8);
            color: #fff;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 0px;
            box-shadow: rgba(30, 30, 30, 0.06) 0px 0px 4px 4px;
        }

        .box-load {
            position: absolute;
            background-color: #ddd;
            color: #000;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 4px;
        }

        #watermark {
            position: absolute;
            display: none;
            background-color: rgba(36, 36, 36, 0.8);
            color: #fff;
            bottom: 0px;
            right: 0px;
            padding: 6px 16px;
        }

        #watermark img {
            width: 20px;
            height: 20px;
            border-radius: 15px;
            border: 1px solid #000;
            filter: invert(100%);
        }

        #loading {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
        }

        #stats {
            top: 0;
            left: 0;
            display: none;
        }

        #username {
            top: 50px;
        }

        #date-v2 {
            top: 100px;
        }

        #username,
        #date-v2 {
            left: 0;
            display: none;
            font-size: 15px;
            padding: 5px 15px;
        }

        #username img {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }

        button {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.2s ease-in-out;
            background-color: #87ceeb;
            padding: 6px 16px;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        #retry {
            display: none;
        }

        #viewer {
            background-color: #333;
        }

        a {
            color: #fff;
        }

        a:visited:hover {
            color: #fff;
        }

        a:visited {
            color: #fff;
        }

        a:hover {
            color: #fff;
        }

        #web-settings {
            top: 0px;
            right: 0px;
            border-radius: 3px;
        }

        #web-settings:hover {
            background-color: #87ceeb;
            color: #000;
            cursor: pointer;
        }

        #web-settings-dropdown {
            display: none;
            right: 0px;
            top: 50px;
            border-radius: 3px;
        }

        #web-settings-dropdown div {
            position: relative;
            border-radius: 3px;
            padding: 2px 2px 2px 2px;
        }

        #web-settings-dropdown div:hover {
            background-color: #87ceeb;
            color: #000;
            cursor: pointer;
        }
    </style>
</head>

                        clearcoat: 0.4,
                        envMapIntensity: 0.5,

                            params.roughness = 0.45;

                            params.roughness = 0.9;
                            params.metalness = 0;
                            params.clearcoat = 0;
                            break;

                        case 'glitter':
                            params.clearcoat = 1;
                            params.roughness = 0.15;
                            break;

                        case 'speckle':
                            params.roughness = 0.5;
                            params.clearcoat = 0.2;
                            break;

                        case 'special':
                        case 'solid':
                        default:
                            break;
                    }

                    let material = new THREE.MeshPhysicalMaterial(params);
                    material.userData.colorcode = partColor;
                    material.name = partColor;
                    return material;

                    wmark.style.display = "block";
                    wmark.innerHTML = "<img src='/img/logo/simplev2.png' alt='Logo' title='Logo' /> gr8brik.rf.gd";

                    stat_name.style.display = "block";
                    stat_name.innerHTML += `<a href="/build/${JSON.parse(window.creation_data).modelid}" target="_blank">${JSON.parse(window.creation_data).name}</a>`;

                    stat_username.style.display = "block";
                    stat_username.innerHTML += `<a href="/user/${JSON.parse(window.creation_data).userid}" target="_blank"><img src='/acc/users/pfps/${JSON.parse(window.creation_data).userid}.webp' alt='User icon' title='User icon' />${JSON.parse(window.creation_data).username}</a>`;

                    stat_date.style.display = "block";
                    stat_date.innerHTML += `${JSON.parse(window.creation_data).date}`;

                    animate();
                }

                window.showViewer = showViewer;

                window.intersectingCheck = function () {
                    console.log(partsIntersecting);
                    scene.traverse((obj) => {
                        const others = partsIntersecting.filter(other => other !== obj)

                        others.forEach(other => {
                            if (obj.intersectsBox(other)) {
                                let OGobj = scene.getObjectById(obj.cloneid);
                                if (debug === true) {
                                    console.log(OGobj + ' is inside another part');
                                }

                                OGobj.material.transparent = true;
                                OGobj.material.opacity = 0.25;
                                OGobj.material.needsUpdate = true;

                                scene.updateMatrixWorld(true);
                                OGobj.updateMatrixWorld(true);
                            }
                        });
                    });
                }

                document.getElementById('web-settings').addEventListener('click', function () {
                    let settings = document.getElementById('web-settings-dropdown');
                    if (settings.style.display == 'none') {
                        settings.style.display = 'block';
                    } else {
                        settings.style.display = 'none';
                    }
                });

                // show ldrawloader lines
                document.getElementById('show-lines').addEventListener('click', () => {
                    const show = window.globalPlayerConfig.model._lines.ldraw === "false";

                    scene.traverse((o) => {
                        if (o.isLineSegments) {
                            o.visible = show;
                        }
                    });

                    window.globalPlayerConfig.model._lines.ldraw = show ? "true" : "false";
                });

                window.addEventListener('resize', onWinResize, true);

                function onWinResize() {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }

                function animate() {
                    requestAnimationFrame(animate);

                    if (controls) {
                        controls.update();
                    }

                    renderer.render(scene, camera);
                }
                animate();
            }

            if (window.globalPlayerConfig.player_redesign_trans === "false") {
                let elements = document.querySelectorAll('.box');

                elements.forEach(e => {
                    e.classList.add("box-load");
                    e.classList.remove("box");
                });
            }
        });
    </script>
    <div id="loading" class="box-load">Loading...</div>
    <button id="retry">Retry</button>
    <div id="stats" class="box"></div>
    <div id="username" class="box">By </div>
    <div id="date-v2" class="box">Created </div>
    <div id="web-settings" class="box right">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sliders2"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M10.5 1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4H1.5a.5.5 0 0 1 0-1H10V1.5a.5.5 0 0 1 .5-.5M12 3.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m-6.5 2A.5.5 0 0 1 6 6v1.5h8.5a.5.5 0 0 1 0 1H6V10a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5M1 8a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 1 8m9.5 2a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V13H1.5a.5.5 0 0 1 0-1H10v-1.5a.5.5 0 0 1 .5-.5m1.5 2.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
        </svg>
    </div>
    <div id="web-settings-dropdown" class="box">
        <div>
            <span id="show-lines">Enable/disable lines</span>
        </div>
    </div>
    <div id="watermark"></div>
    <canvas id="viewer" style="width: 100vw; height: 100vh; display: none;"></canvas>
</body>
